name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: myproject

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}" > local.properties

      - name: ktlint format check
        run: |
          ./gradlew ktlintFormat
          git diff --exit-code || (echo "ktlint found unformatted files. Run ./gradlew ktlintFormat locally." && exit 1)

      - name: Static Analysis
        run: ./gradlew staticAnalysis

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            myproject/app/build/reports/lint/
            myproject/app/build/reports/ktlint/
            myproject/app/build/reports/detekt/
          retention-days: 7

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: myproject/app/build/reports/tests/
          retention-days: 7

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Build AAB
        run: ./gradlew bundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: myproject/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.aab
          path: myproject/app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 14
